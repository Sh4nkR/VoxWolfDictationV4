name: VoxWolf CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    name: Enforcement checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Forbidden API scan
        run: |
          chmod +x scripts/forbidden_api_scan.sh
          scripts/forbidden_api_scan.sh

      - name: Manifest check (source)
        run: |
          chmod +x scripts/manifest_check.sh
          scripts/manifest_check.sh

  apk:
    name: Build sideload APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Ensure Whisper model is a real binary
        run: |
          MODEL="app/src/main/assets/models/ggml-tiny.en-q5_1.bin"
          SIZE=$(wc -c < "$MODEL" | tr -d ' ')
          echo "model bytes=$SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "LFS pointer detected — downloading ggml-tiny.en-q5_1.bin"
            curl -fL --retry 5 -o "$MODEL"               "https://media.githubusercontent.com/media/Sh4nkR/VoxWolfDictation/main/app/src/main/assets/models/ggml-tiny.en-q5_1.bin"
            ls -lh "$MODEL"
          fi

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build sideload APK (release flavor, debug-signed)
        run: ./gradlew :app:assembleProdDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" dist/VoxWolfDictation-4.1.1.apk
          ls -lh dist/VoxWolfDictation-4.1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxWolfDictation-4.1.1
          path: dist/VoxWolfDictation-4.1.1.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.1
          name: VoxWolf Dictation 4.1.1
          files: dist/VoxWolfDictation-4.1.1.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Sideload APK for Android 12+ (arm64). Debug-signed so you can install it without a Play Store listing.

            **Fix in 4.1.1**
            Model Ready no longer stays red forever. The transcription model is copied automatically on the setup screen, so Start VoxWolf can actually enable.

            **On your phone**
            1. Uninstall the previous VoxWolf build if Android blocks the update
            2. Open this release and tap `VoxWolfDictation-4.1.1.apk`
            3. Allow install from this browser / Files if Android asks
            4. Open the app — wait until Model Ready turns green (a few seconds)
            5. Tap Start VoxWolf

            Offline speech uses the bundled tiny.en Whisper model. No internet permission.

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: enforce
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
