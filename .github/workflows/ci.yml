name: VoxWolf CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]

jobs:
  enforce:
    name: Enforcement checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Forbidden API scan
        run: |
          chmod +x scripts/forbidden_api_scan.sh
          scripts/forbidden_api_scan.sh

      - name: Manifest check (source)
        run: |
          chmod +x scripts/manifest_check.sh
          scripts/manifest_check.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: enforce
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.3.11075529" "cmake;3.22.1"

      - name: Build release variant
        run: ./gradlew assembleReleaseRelease --no-daemon

      - name: Build harness variant
        run: ./gradlew assembleHarnessDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testReleaseReleaseUnitTest --no-daemon

      - name: Forbidden API scan (post-build)
        run: scripts/forbidden_api_scan.sh

      - name: Manifest check (merged)
        run: scripts/manifest_check.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: enforce
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test --no-daemon
